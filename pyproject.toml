[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shelfcash-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi", "uvicorn[standard]", "pydantic>=2", "pydantic-settings",
  "python-multipart", "pandas>=2.0,<4.0", "numpy>=1.24,<3.0",
  "lightgbm>=4.0,<5.0", "scikit-learn>=1.3,<2.0", "statsmodels>=0.14,<1.0",
  "joblib>=1.3,<2.0", "pyarrow>=14,<24", "typer>=0.12,<1.0",
  "openpyxl", "xlrd",
  "sqlalchemy", "alembic", "httpx",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]
kaggle = ["transformers>=4.51.0", "accelerate", "bitsandbytes", "sentencepiece"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
